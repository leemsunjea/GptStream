<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>스트리밍 챗봇</title>
  <style>
    :root {
      --primary-color: #FFFFFF;
      --secondary-color: #9ca3af;
      --background-color: #323232;
      --card-background: #323232;
      --user-message-bg: #444654;
      --input-bg: #3C3C3C;
      --code-bg: #2D2E39;
      --border-color: #374151;
      --shadow-color: rgba(0, 0, 0, 0.3);
      --text-color: #ECECF1;
      --text-color-bright: #FFFFFF;
      --scrollbar-color: #555;
      --transition-duration: 0.3s;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background-color: var(--background-color);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 20px;
      color: var(--text-color);
      display: flex;
      gap: 20px;
      overflow: hidden;
    }

    .main-container {
      display: flex;
      width: 100%;
      height: calc(100vh - 40px);
      gap: 20px;
    }

    .chat-container {
      width: 60%;
      height: 100%;
      background-color: var(--background-color);
      border-radius: 16px;
      box-shadow: 0 8px 24px var(--shadow-color);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 10px;
    }

    .system-log {
      width: 40%;
      height: 100%;
      background-color: var(--card-background);
      border-radius: 16px;
      box-shadow: 0 4px 12px var(--shadow-color);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .chat-header, .system-log-header {
      padding: 20px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 10px;
      background-color: var(--card-background);
    }

    .chat-header svg {
      width: 24px;
      height: 24px;
      fill: var(--primary-color);
      transition: transform var(--transition-duration);
    }

    .chat-header:hover svg {
      transform: rotate(10deg);
    }

    .chat-header small {
      font-size: 14px;
      color: var(--secondary-color);
    }

    .system-log-header h3 {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-color);
    }

    .chat-body {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
      background-color: var(--background-color);
    }

    .system-log-body {
      padding: 16px;
      height: 100%;
      overflow-y: auto;
      font-size: 13px;
      line-height: 1.5;
      color: var(--text-color);
      background-color: var(--card-background);
    }

    .chat-body::-webkit-scrollbar,
    .system-log-body::-webkit-scrollbar {
      width: 8px;
    }

    .chat-body::-webkit-scrollbar-track,
    .system-log-body::-webkit-scrollbar-track {
      background: transparent;
    }

    .chat-body::-webkit-scrollbar-thumb,
    .system-log-body::-webkit-scrollbar-thumb {
      background-color: var(--scrollbar-color);
      border-radius: 4px;
    }

    .message {
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.4;
      word-wrap: break-word;
      transition: all var(--transition-duration);
    }

    .message.bot {
      background-color: var(--card-background);
      align-self: stretch;
      width: 100%;
      color: var(--text-color);
      border-radius: 0;
      padding: 16px 0;
      white-space: pre-line;
      animation: fadeIn 0.3s ease-out forwards;
      opacity: 0;
    }

    .message.user {
      background-color: var(--user-message-bg);
      color: var(--text-color);
      align-self: flex-end;
      max-width: 85%;
      border-bottom-right-radius: 4px;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .chat-input {
      padding: 15px;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      background-color: var(--input-bg);
    }

    .input-wrapper {
      display: flex;
      gap: 8px;
      align-items: center;
      background-color: #3C3C3C;
      border-radius: 12px;
      padding: 1px;
    }

    .input-wrapper input {
      flex: 1;
      border: none;
      background: transparent;
      outline: none;
      font-size: 15px;
      padding: 8px 0;
      color: var(--text-color) !important;
      min-height: 24px;
      max-height: 200px;
    }

    .input-wrapper input::placeholder {
      color: var(--secondary-color);
    }

    .send-icon {
      width: 32px;
      height: 32px;
      background-color: var(--primary-color);
      color: var(--background-color);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 16px;
    }

    .send-icon:hover {
      opacity: 0.8;
    }

    .floating-btn {
      position: fixed;
      bottom: 30px;
      right: 30px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: none;
      font-size: 20px;
      cursor: pointer;
      box-shadow: 0 4px 12px var(--shadow-color);
      transition: all var(--transition-duration);
      z-index: 1000;
      background-color: var(--input-bg);
      color: #9ca3af;
    }

    .floating-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px var(--shadow-color);
    }

    .pdf-upload {
      display: none;
    }

    .system-log-message {
      padding: 10px;
      margin: 5px 0;
      background-color: var(--code-bg);
      border-radius: 8px;
      font-family: monospace;
      word-break: break-all;
      color: var(--text-color);
    }

    pre, code {
      background-color: var(--code-bg) !important;
      color: var(--text-color-bright) !important;
      border-radius: 6px;
      padding: 12px;
      font-family: 'Courier New', Courier, monospace;
      overflow-x: auto;
    }

    code {
      padding: 2px 4px;
      font-size: 0.9em;
    }

    pre code {
      background: none !important;
      padding: 0;
    }

    .message.bot h1,
    .message.bot h2,
    .message.bot h3 {
      color: var(--text-color-bright);
      margin: 16px 0 8px 0;
      font-weight: 600;
    }

    .message.bot ul,
    .message.bot ol {
      margin: 10px 0;
      padding-left: 20px;
    }

    .message.bot li {
      margin: 4px 0;
    }

    .message.bot strong {
      color: var(--text-color-bright);
      font-weight: 600;
    }

    .message.bot em {
      color: var(--secondary-color);
      font-style: italic;
    }

    .pdf-upload input[type="file"] {
      display: none;
    }
  </style>
</head>

<body>
  <div class="main-container">
    <div class="chat-container" id="chat-container-main">
      <div class="chat-header">
        <svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="10" />
        </svg>
        <small>PDF를 업로드하고 질문해보세요!</small>
      </div>
      
      <div class="chat-body" id="chat-body-main"></div>
      
      <div class="chat-input">
        <div class="input-wrapper">
          <input type="text" id="chat-input-field-main" placeholder="메시지를 입력해주세요.">
          <button class="send-icon" id="sendButton-main">→</button>
        </div>
      </div>
    </div>

    <div class="system-log">
      <div class="system-log-header">
        <h3>시스템 로그</h3>
      </div>
      <div class="system-log-body" id="system-log-body"></div>
    </div>
  </div>

  <!-- PDF 업로드 -->
  <div class="pdf-upload">
    <input type="file" id="pdfInput-main" accept="application/pdf">
  </div>

  <!-- 플로팅 버튼들 -->
  <button class="floating-btn" id="uploadPdfBtn-main" title="PDF 업로드">📄</button>
  <button class="floating-btn" id="resetDataBtn-main" title="데이터 초기화" style="bottom: 90px;">🗑️</button>
  <button class="floating-btn" id="resetPromptBtn-main" title="프롬프트 초기화" style="bottom: 150px;">🔄</button>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const API_BASE = window.location.origin;
      const input = document.getElementById("chat-input-field-main");
      const chatBox = document.getElementById("chat-body-main");
      const sendButton = document.getElementById("sendButton-main");
      const uploadButton = document.getElementById("uploadPdfBtn-main");
      const fileInput = document.getElementById("pdfInput-main");
      const logBody = document.getElementById("system-log-body");
      const resetDataButton = document.getElementById("resetDataBtn-main");
      const resetPromptButton = document.getElementById("resetPromptBtn-main");

      const lastProcessedLogCounts = {};
      let lastBotDiv = null;
      let partial = "";

      // 마크다운 파서
      function parseMarkdown(text) {
        return text
          .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
          .replace(/\*(.*?)\*/g, '<em>$1</em>')
          .replace(/`(.*?)`/g, '<code>$1</code>')
          .replace(/```([\\s\\S]*?)```/g, '<pre><code>$1</code></pre>')
          .replace(/^### (.*$)/gim, '<h3>$1</h3>')
          .replace(/^## (.*$)/gim, '<h2>$1</h2>')
          .replace(/^# (.*$)/gim, '<h1>$1</h1>')
          .replace(/^\\* (.+)/gm, '<li>$1</li>')
          .replace(/(<li>.*<\\/li>)/s, '<ul>$1</ul>')
          .replace(/^\\d+\\. (.+)/gm, '<li>$1</li>')
          .replace(/(<li>.*<\\/li>)/s, '<ol>$1</ol>');
      }

      // 메시지 추가
      function appendMessage(sender, message) {
        const messageDiv = document.createElement("div");
        messageDiv.classList.add("message", sender);
        
        if (sender === "bot") {
          messageDiv.innerHTML = parseMarkdown(message);
        } else {
          messageDiv.textContent = message;
        }
        
        chatBox.appendChild(messageDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
      }

      // 시스템 로그 추가
      function appendSystemLog(message) {
        const logDiv = document.createElement("div");
        logDiv.classList.add("system-log-message");
        logDiv.textContent = message;
        logBody.appendChild(logDiv);
        logBody.scrollTop = logBody.scrollHeight;
      }

      // 메시지 전송
      async function sendMessage() {
        const message = input.value.trim();
        if (!message) return;

        let userId = localStorage.getItem("userId");
        if (!userId) {
          userId = crypto.randomUUID();
          localStorage.setItem("userId", userId);
        }

        appendMessage("user", message);
        input.value = "";
        lastBotDiv = null;
        partial = "";

        try {
          const response = await fetch(`${API_BASE}/chat/stream`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "x-user-id": userId,
            },
            body: JSON.stringify({ message }),
          });

          if (!response.ok) {
            throw new Error(`HTTP 오류: ${response.status}`);
          }

          const reader = response.body.getReader();
          const decoder = new TextDecoder();
          let buffer = "";
          let isDone = false;

          while (!isDone) {
            const { done, value } = await reader.read();
            if (done) break;

            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split("\\n");
            buffer = lines.pop();

            for (let line of lines) {
              if (line.startsWith("data: ")) {
                let rawContent = line.slice(6).trim();
                if (rawContent === "[DONE]") {
                  isDone = true;
                } else {
                  try {
                    let content = JSON.parse(rawContent);
                    if (typeof content === "string") {
                      if (content.startsWith("[참고한 문단]") || content.startsWith("[문단 ")) {
                        appendSystemLog(content);
                      } else {
                        partial += content;
                        if (!lastBotDiv) {
                          lastBotDiv = document.createElement("div");
                          lastBotDiv.classList.add("message", "bot");
                          chatBox.appendChild(lastBotDiv);
                        }
                        lastBotDiv.innerHTML = parseMarkdown(partial);
                        chatBox.scrollTop = chatBox.scrollHeight;
                      }
                    }
                  } catch (e) {
                    console.error("JSON 파싱 오류:", e);
                  }
                }
              }
            }
          }
        } catch (error) {
          console.error("메시지 전송 오류:", error);
          appendMessage("bot", "죄송합니다. 오류가 발생했습니다.");
        }
      }

      // PDF 업로드
      async function uploadPdf() {
        const file = fileInput.files[0];
        if (!file) return;

        let userId = localStorage.getItem("userId");
        if (!userId) {
          userId = crypto.randomUUID();
          localStorage.setItem("userId", userId);
        }

        const formData = new FormData();
        formData.append("file", file);

        try {
          const response = await fetch(`${API_BASE}/vector/upload_pdf`, {
            method: "POST",
            headers: { "x-user-id": userId },
            body: formData,
          });

          const result = await response.json();
          if (response.ok && result.success) {
            appendMessage("bot", `PDF "${file.name}" 업로드가 시작되었습니다.`);
            if (result.logs && Array.isArray(result.logs)) {
              result.logs.forEach(msg => appendSystemLog(msg));
              if (result.task_id) {
                lastProcessedLogCounts[result.task_id] = result.logs.length;
              }
            }
            if (result.task_id) {
              pollTaskStatus(result.task_id);
            }
          } else {
            appendMessage("bot", `PDF 업로드 실패: ${result.detail || "서버 오류"}`);
          }
        } catch (error) {
          console.error("업로드 오류:", error);
          appendMessage("bot", "PDF 업로드 중 오류가 발생했습니다.");
        }
      }

      // 태스크 상태 폴링
      async function pollTaskStatus(taskId) {
        while (true) {
          try {
            const response = await fetch(`${API_BASE}/vector/task_status/${taskId}`);
            const result = await response.json();

            if (response.status === 404) {
              appendSystemLog(`작업 상태 확인 오류 - Task ID: ${taskId}`);
              return;
            }

            if (result.logs && Array.isArray(result.logs)) {
              const lastCount = lastProcessedLogCounts[taskId] || 0;
              const newLogs = result.logs.slice(lastCount);
              newLogs.forEach(msg => appendSystemLog(msg));
              lastProcessedLogCounts[taskId] = result.logs.length;
            }

            if (result.status === "completed") {
              appendMessage("bot", "PDF 처리가 완료되었습니다. 이제 문서에 대해 질문할 수 있습니다.");
              break;
            } else if (result.status === "failed") {
              appendMessage("bot", "PDF 처리에 실패했습니다.");
              break;
            }

            await new Promise(resolve => setTimeout(resolve, 3000));
          } catch (error) {
            console.error("폴링 오류:", error);
            break;
          }
        }
      }

      // 데이터 초기화
      async function resetUserData() {
        const userId = localStorage.getItem("userId");
        if (!userId) {
          appendMessage("bot", "사용자 ID를 찾을 수 없습니다.");
          return;
        }

        if (!confirm("정말로 모든 문서 데이터를 삭제하시겠습니까?")) {
          return;
        }

        try {
          const response = await fetch(`${API_BASE}/vector/reset_user_data`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "x-user-id": userId,
            }
          });

          const result = await response.json();
          if (response.ok && result.success) {
            appendMessage("bot", "데이터가 성공적으로 초기화되었습니다.");
            if (result.logs) {
              result.logs.forEach(msg => appendSystemLog(msg));
            }
          } else {
            appendMessage("bot", `데이터 초기화 실패: ${result.detail || "서버 오류"}`);
          }
        } catch (error) {
          console.error("데이터 초기화 오류:", error);
          appendMessage("bot", "데이터 초기화 중 오류가 발생했습니다.");
        }
      }

      // 프롬프트 초기화
      async function resetUserPrompt() {
        const userId = localStorage.getItem("userId");
        if (!userId) {
          appendMessage("bot", "사용자 ID를 찾을 수 없습니다.");
          return;
        }

        if (!confirm("정말로 프롬프트를 기본값으로 초기화하시겠습니까?")) {
          return;
        }

        try {
          const response = await fetch(`${API_BASE}/chat/reset_prompt`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "x-user-id": userId,
            }
          });

          const result = await response.json();
          if (response.ok && result.success) {
            appendMessage("bot", "프롬프트가 기본값으로 초기화되었습니다.");
          } else {
            appendMessage("bot", `프롬프트 초기화 실패: ${result.detail || "서버 오류"}`);
          }
        } catch (error) {
          console.error("프롬프트 초기화 오류:", error);
          appendMessage("bot", "프롬프트 초기화 중 오류가 발생했습니다.");
        }
      }

      // 이벤트 리스너
      input.addEventListener("keypress", function(e) {
        if (e.key === "Enter") {
          sendMessage();
        }
      });

      sendButton.addEventListener("click", sendMessage);
      uploadButton.addEventListener("click", () => fileInput.click());
      fileInput.addEventListener("change", () => {
        if (fileInput.files.length > 0) {
          uploadPdf();
        }
      });
      resetDataButton.addEventListener("click", resetUserData);
      resetPromptButton.addEventListener("click", resetUserPrompt);
    });
  </script>
</body>
</html>
