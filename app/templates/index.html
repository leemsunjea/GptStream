<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <title>스트리밍 챗봇</title>
  <style>
    /* Global Styles */
    :root {
      --primary-color: #007bff;
      --secondary-color: #6c757d;
      --background-color: #f8f9fa;
      --card-background: #ffffff;
      --border-color: #dee2e6;
      --shadow-color: rgba(0, 0, 0, 0.1);
      --transition-duration: 0.3s;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background-color: var(--background-color);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      margin: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(430px, 1fr));
      gap: 30px;
      padding: 20px;
    }

    /* Chat Container Styles */
    .chat-container {
      width: 100%;
      max-width: 430px;
      height: 705px;
      background-color: var(--card-background);
      border-radius: 20px;
      box-shadow: 0 8px 24px var(--shadow-color);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: all var(--transition-duration);
    }

    /* Header Styles */
    .chat-header {
      padding: 20px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .chat-header svg {
      width: 24px;
      height: 24px;
      fill: var(--primary-color);
      transition: transform var(--transition-duration);
    }

    .chat-header:hover svg {
      transform: rotate(10deg);
    }

    .chat-header small {
      font-size: 14px;
      color: var(--secondary-color);
      transition: color var(--transition-duration);
    }

    .chat-header:hover small {
      color: var(--primary-color);
    }

    /* Body Styles */
    .chat-body {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
      scrollbar-width: thin;
      scrollbar-color: var(--border-color) transparent;
    }

    .chat-body::-webkit-scrollbar {
      width: 8px;
    }

    .chat-body::-webkit-scrollbar-track {
      background: transparent;
    }

    /* Input field text color */
    #chat-input-field,
    #chat-input-field-alt {
      color: #000000 !important;
      /* 검정색 텍스트 */
    }

    /* Placeholder text color */
    #chat-input-field::placeholder,
    #chat-input-field-alt::placeholder {
      color: #666666 !important;
      /* 어두운 회색 플레이스홀더 */
    }

    .chat-body::-webkit-scrollbar-thumb {
      background-color: var(--border-color);
      border-radius: 4px;
    }

    /* Message Styles */
    .message {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.4;
      word-wrap: break-word;
      transition: all var(--transition-duration);
    }

    .message.bot {
      background-color: #f8f9fa;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
      white-space: pre-line;
      /* 추가된 부분: \n 문자를 기준으로 자동 줄바꿈 */
    }

    .message.user {
      background-color: var(--primary-color);
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    /* Input Section Styles */
    .chat-input {
      padding: 15px;
      border-top: 1px solid var(--border-color);
      background-color: #f8f9fa;
      transition: background-color var(--transition-duration);
    }

    .chat-input:hover {
      background-color: #f5f5f5;
    }

    .input-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
      background: white;
      border-radius: 25px;
      padding: 10px 15px;
      box-shadow: 0 2px 4px var(--shadow-color);
      transition: all var(--transition-duration);
    }

    .input-wrapper:hover {
      box-shadow: 0 4px 8px var(--shadow-color);
    }

    .input-wrapper input {
      flex: 1;
      border: none;
      background: transparent;
      outline: none;
      font-size: 15px;
      padding: 8px 0;
      color: #212529;
      transition: color var(--transition-duration);
    }

    .input-wrapper input:focus {
      color: #000000 !important;
      /* 검정색 텍스트 유지 */
    }

    .send-icon {
      cursor: pointer;
      background: none;
      border: none;
      font-size: 18px;
      color: var(--primary-color);
      transition: all var(--transition-duration);
    }

    .send-icon:hover {
      transform: scale(1.1);
      color: #0056b3;
    }

    /* PDF Upload Section */
    .pdf-upload {
      padding: 15px;
      border-top: 1px solid var(--border-color);
      background-color: #f8f9fa;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: background-color var(--transition-duration);
    }

    .pdf-upload:hover {
      background-color: #f5f5f5;
    }

    .pdf-upload input[type="file"] {
      flex: 1;
      font-size: 14px;
      padding: 8px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      outline: none;
      transition: all var(--transition-duration);
    }

    .pdf-upload input[type="file"]:hover {
      border-color: var(--primary-color);
    }

    .pdf-upload button {
      padding: 8px 16px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
      transition: all var(--transition-duration);
    }

    .pdf-upload button:hover {
      background-color: #0056b3;
      transform: translateY(-1px);
      box-shadow: 0 2px 4px var(--shadow-color);
    }

    /* System Log Styles */
    .system-log {
      width: 100%;
      max-width: 430px;
      height: 705px;
      background-color: var(--card-background);
      border-radius: 20px;
      box-shadow: 0 8px 24px var(--shadow-color);
      overflow: hidden;
      transition: all var(--transition-duration);
    }

    .system-log:hover {
      box-shadow: 0 12px 32px var(--shadow-color);
    }

    .system-log-body {
      padding: 20px;
      height: calc(100% - 60px);
      overflow-y: auto;
      font-size: 13px;
      color: #333;
      scrollbar-width: thin;
      scrollbar-color: var(--border-color) transparent;
    }

    .system-log-body::-webkit-scrollbar {
      width: 8px;
    }

    .system-log-body::-webkit-scrollbar-track {
      background: transparent;
    }

    .system-log-body::-webkit-scrollbar-thumb {
      background-color: var(--border-color);
      border-radius: 4px;
    }

    .system-log-message {
      padding: 10px;
      margin: 5px 0;
      background-color: #f8f9fa;
      border-radius: 8px;
      font-family: monospace;
      word-break: break-all;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 60px;
      background: #f8f9fa;
    }

    #chat-popup-alt {
      position: static;
      margin: 0;
      width: 430px;
      height: 705px;
      background-color: #fff;
      border-radius: 30px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
      opacity: 1;
      transition: opacity 0.3s ease, transform 0.3s ease;
      z-index: 999;
      pointer-events: auto;
    }

    #chat-header-alt {
      background-color: transparent;
      padding: 20px;
      font-size: 16px;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }

    #chat-svg-alt {
      margin-bottom: 0.5px;
    }

    #chat-header-alt small {
      display: block;
      font-size: 12px;
      color: #666;
    }

    #chat-body-alt {
      padding: 10px;
      height: calc(95% - 190px);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .input-wrapper-alt {
      display: flex;
      align-items: center;
      background: #f1f1f1;
      border-radius: 30px;
      padding: 5px 10px;
    }

    .input-wrapper-alt input {
      flex: 1;
      border: none;
      background: transparent;
      outline: none;
      font-size: 16px;
      padding: 10px;
    }

    .send-icon-alt {
      cursor: pointer;
      background: none;
      border: none;
    }
  </style>
</head>

<body>
  <div class="chat-container" id="chat-container-main">
    <div class="chat-header">
      <svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="12" r="10" />
      </svg>
      <small>저희 챗봇과 대화하세요!</small>
    </div>
    <div class="chat-body" id="chat-body-main">
      <div class="message bot">안녕하세요! 무엇을 도와드릴까요?</div>
    </div>
    <div class="pdf-upload">
      <input type="file" id="pdfInput-main" accept="application/pdf" style="display: none;" />
      <button id="uploadPdfBtn-main">PDF 업로드</button>
      <button id="resetDataBtn-main" style="background-color: #dc3545;">데이터 초기화</button>
      <button id="resetPromptBtn-main" style="background-color: #ffc107; color: #212529;">프롬프트 초기화</button>
    </div>
    <div class="chat-input">
      <div class="input-wrapper">
        <input type="text" id="chat-input-field-main" placeholder="메시지를 입력해주세요.">
        <button class="send-icon" id="sendButton-main">→</button>
      </div>
    </div>
  </div>

  <div class="chat-container" id="chat-container-alt">
    <div class="chat-header">
      <svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="12" r="10" />
      </svg>
      <small>챗봇 프롬프트를 추가해보세요!</small>
    </div>
    <div class="chat-body" id="chat-body-alt">
    </div>
    <div class="chat-input">
      <div class="input-wrapper">
        <input type="text" id="chat-input-field-alt" placeholder="메시지를 입력해주세요.">
        <button class="send-icon" id="sendButton-alt">→</button>
      </div>
    </div>
  </div>

  <div class="system-log">
    <div class="chat-header">
      <svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="12" r="10" />
      </svg>
      <small>시스템 로그</small>
    </div>
    <div class="system-log-body" id="system-log-body">
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const API_BASE = window.location.origin;
      const input = document.getElementById("chat-input-field-main");
      const chatBox = document.getElementById("chat-body-main");
      const sendButton = document.getElementById("sendButton-main");
      const uploadButton = document.getElementById("uploadPdfBtn-main");
      const fileInput = document.getElementById("pdfInput-main");
      const logBody = document.getElementById("system-log-body"); // 시스템 로그 요소
      const resetDataButton = document.getElementById("resetDataBtn-main");
      const resetPromptButton = document.getElementById("resetPromptBtn-main");

      // 각 task_id별로 마지막으로 처리한 로그의 수를 저장하는 객체
      const lastProcessedLogCounts = {};

      if (!logBody) {
        console.error("system-log-body 요소를 찾을 수 없습니다. 로그를 출력할 수 없습니다.");
        return;
      }

      let lastBotDiv = null;
      let partial = "";

      // 메시지 추가 함수
      function appendMessage(role, message) {
        const msg = document.createElement("div");
        msg.classList.add("message", role);
        msg.textContent = message;
        chatBox.appendChild(msg);
        chatBox.scrollTop = chatBox.scrollHeight;
        return msg;
      }

      // 시스템 로그 출력 함수
      function appendSystemLog(message) {
        console.log("appendSystemLog 호출:", message);
        const msg = document.createElement("div");
        msg.classList.add("system-log-message");
        msg.textContent = message;
        logBody.appendChild(msg);
        logBody.scrollTop = logBody.scrollHeight;
      }

      // 챗봇 메시지 전송 함수
      async function sendMessage() {
        const message = input.value.trim();
        if (!message) return;

        appendMessage("user", message);
        input.value = "";
        sendButton.style.display = "none";
        partial = "";
        lastBotDiv = null;
        let references = "";
        let refDiv = null;
        let isDone = false;

        let userId = localStorage.getItem("userId") || (localStorage.setItem("userId", crypto.randomUUID()), localStorage.getItem("userId"));

        try {
          const response = await fetch(`${API_BASE}/chat/stream`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "x-user-id": userId,
            },
            body: JSON.stringify({ message: message })
          });
          const reader = response.body.getReader();
          const decoder = new TextDecoder();
          let buffer = "";

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split("\n");
            buffer = lines.pop(); // 마지막 미완성 줄을 버퍼로 유지

            for (let line of lines) {
              if (line.startsWith("data: ")) {
                let content = line.slice(6);
                if (content === "[DONE]") {
                  isDone = true;
                } else if (content.startsWith("[참고한 문단]") || content.startsWith("[문단 ")) {
                  references += content + "\n";
                  appendSystemLog(content); // 시스템 로그에 출력
                } else if (!isDone) {
                  partial += content;
                  if (!lastBotDiv) {
                    lastBotDiv = document.createElement("div");
                    lastBotDiv.classList.add("message", "bot");
                    chatBox.appendChild(lastBotDiv);
                  }
                  lastBotDiv.textContent = partial;
                }
                chatBox.scrollTop = chatBox.scrollHeight;
              }
            }
          }
        } catch (err) {
          console.error("전송 오류:", err);
          appendMessage("bot", "오류가 발생했습니다. 다시 시도해주세요.");
        } finally {
          sendButton.style.display = "";
        }
      }
      // PDF 업로드 함수 (폴링 추가)
      async function uploadPdf() {
        const file = fileInput.files[0];
        if (!file) {
          appendMessage("bot", "PDF 파일을 선택해주세요.");
          // appendSystemLog는 uploadPdf 내부에서 직접 호출하지 않고, pollTaskStatus를 통해 일관되게 처리되도록 함.
          // 단, 초기 사용자 피드백은 즉시 주는 것이 좋으므로, 이 부분은 유지하거나 사용자 경험에 맞게 조정.
          // 여기서는 초기 메시지는 즉시 appendSystemLog로 보내고, lastProcessedLogCounts를 업데이트하는 방향으로 진행.
          appendSystemLog("PDF 파일이 선택되지 않았습니다.");
          return;
        }

        const formData = new FormData();
        formData.append("file", file);

        let userId = localStorage.getItem("userId"); // userId 가져오기
        if (!userId) {
          // userId가 없는 경우에 대한 처리 (예: 에러 메시지 또는 새로 생성)
          // 여기서는 sendMessage와 유사하게 userId를 생성하도록 할 수 있으나,
          // 일반적으로 업로드 전에 사용자가 식별되어야 합니다.
          // 이 예제에서는 userId가 있다고 가정하고 진행합니다. (실제로는 로그인/세션 관리가 필요)
          // 만약 userId가 없다면, 아래 fetch 호출 전에 생성하거나 사용자에게 알림을 표시해야 합니다.
          // 임시로, userId가 없으면 새로 생성하는 로직을 추가 (채팅과 동일하게)
          userId = crypto.randomUUID();
          localStorage.setItem("userId", userId);
          appendSystemLog("새로운 userId 생성 (PDF 업로드용): " + userId);
        }

        try {
          const response = await fetch(`${API_BASE}/vector/upload_pdf`, {
            method: "POST",
            headers: { // 헤더 추가
              "x-user-id": userId
            },
            body: formData
          });

          if (!response.ok) {
            const text = await response.text();
            console.error(`서버 응답 오류: ${response.status} ${response.statusText}`, text.slice(0, 200));
            appendMessage("bot", `PDF 업로드 실패: 서버 오류 (${response.status})`);
            appendSystemLog(`서버 오류: ${response.status} ${response.statusText}`);
            return;
          }

          const result = await response.json();
          console.log("서버 응답:", result);

          if (result.success) {
            appendMessage("bot", result.message || "PDF 처리가 시작되었습니다.");
            if (result.logs && Array.isArray(result.logs)) {
              console.log("초기 로그 출력:", result.logs);
              result.logs.forEach(msg => appendSystemLog(msg));
              // 폴링 시작 전에 초기 로그 수를 기록
              if (result.task_id) {
                lastProcessedLogCounts[result.task_id] = result.logs.length;
              }
            }
            // 폴링 시작
            if (result.task_id) {
              console.log("Received task_id:", result.task_id); // task_id 확인
              pollTaskStatus(result.task_id);
            }
          } else {
            appendMessage("bot", `PDF 업로드 실패: ${result.detail || "서버 오류"}`);
            if (result.logs && Array.isArray(result.logs)) {
              result.logs.forEach(msg => appendSystemLog(msg));
            } else {
              appendSystemLog(`업로드 실패: ${result.detail || "서버 오류"}`);
            }
          }
        } catch (error) {
          console.error("업로드 오류:", error);
          appendMessage("bot", "PDF 업로드 중 오류가 발생했습니다.");
          appendSystemLog(`PDF 업로드 중 오류: ${error.message}`);
        }
      }

      // 작업 상태 폴링 함수
      async function pollTaskStatus(task_id) {
        // 해당 task_id에 대한 마지막 로그 수 초기화 (uploadPdf에서 설정했을 수도 있음)
        if (lastProcessedLogCounts[task_id] === undefined) {
            lastProcessedLogCounts[task_id] = 0;
        }

        const interval = setInterval(async () => {
          try {
            const response = await fetch(`${API_BASE}/vector/task_status/${task_id}`);
            if (!response.ok) {
              console.error(`작업 상태 확인 오류: ${response.status}`);
              appendSystemLog(`작업 상태 확인 오류 (HTTP ${response.status}) - Task ID: ${task_id}`);
              clearInterval(interval);
              delete lastProcessedLogCounts[task_id]; // 오류 시 해당 태스크 ID 정리
              return;
            }
            const result = await response.json();

            // 새로운 로그만 appendSystemLog로 전달
            if (result.logs && Array.isArray(result.logs)) {
              const newLogs = result.logs.slice(lastProcessedLogCounts[task_id]);
              newLogs.forEach(msg => appendSystemLog(msg));
              lastProcessedLogCounts[task_id] = result.logs.length; // 처리한 로그 수 업데이트
            }

            if (result.status === "completed") {
              appendMessage("bot", `PDF 처리 완료: ${result.page_count || 0} 페이지 (Task ID: ${task_id})`);
              clearInterval(interval);
              delete lastProcessedLogCounts[task_id]; // 완료 시 해당 태스크 ID 정리
            } else if (result.status === "failed") {
              appendMessage("bot", `PDF 처리 실패: ${result.detail || "서버 오류"} (Task ID: ${task_id})`);
              clearInterval(interval);
              delete lastProcessedLogCounts[task_id]; // 실패 시 해당 태스크 ID 정리
            }
          } catch (error) {
            console.error("폴링 오류:", error);
            appendSystemLog(`작업 상태 폴링 중 예외 발생 (Task ID: ${task_id}): ${error.message}`);
            clearInterval(interval);
            delete lastProcessedLogCounts[task_id]; // 예외 발생 시 해당 태스크 ID 정리
          }
        }, 2000); // 2초마다 폴링
      }

      // PDF 업로드 버튼 클릭 시 파일 선택창 열기
      uploadButton.addEventListener("click", function () {
        fileInput.value = "";
        fileInput.click();
      });

      // 파일 선택 시 자동 업로드
      fileInput.addEventListener("change", function () {
        if (fileInput.files.length > 0) {
          uploadPdf();
        }
      });

      // 데이터 초기화 함수
      async function resetUserData() {
        const userId = localStorage.getItem("userId");
        if (!userId) {
          appendMessage("bot", "사용자 ID를 찾을 수 없습니다.");
          appendSystemLog("데이터 초기화 실패: 사용자 ID 없음");
          return;
        }

        if (!confirm("정말로 모든 문서 데이터와 임베딩을 삭제하시겠습니까? 이 작업은 되돌릴 수 없습니다.")) {
          return;
        }

        appendSystemLog(`사용자 [${userId}] 데이터 초기화 요청 중...`);
        try {
          const response = await fetch(`${API_BASE}/vector/reset_user_data`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "x-user-id": userId,
            }
          });
          const result = await response.json();
          if (response.ok && result.success) {
            appendMessage("bot", "사용자 데이터가 성공적으로 초기화되었습니다.");
            appendSystemLog(`사용자 [${userId}] 데이터 초기화 완료: ${result.message}`);
          } else {
            appendMessage("bot", `데이터 초기화 실패: ${result.detail || "서버 오류"}`);
            appendSystemLog(`사용자 [${userId}] 데이터 초기화 실패: ${result.detail}`);
          }
        } catch (error) {
          console.error("데이터 초기화 오류:", error);
          appendMessage("bot", "데이터 초기화 중 오류가 발생했습니다.");
          appendSystemLog(`데이터 초기화 중 클라이언트 오류: ${error.message}`);
        }
      }

      // 프롬프트 초기화 함수
      async function resetUserPrompt() {
        const userId = localStorage.getItem("userId");
        if (!userId) {
          appendMessage("bot", "사용자 ID를 찾을 수 없습니다.");
          appendSystemLog("프롬프트 초기화 실패: 사용자 ID 없음");
          return;
        }

        if (!confirm("정말로 사용자 정의 시스템 프롬프트를 기본값으로 초기화하시겠습니까?")) {
          return;
        }
        
        appendSystemLog(`사용자 [${userId}] 프롬프트 초기화 요청 중...`);
        try {
          const response = await fetch(`${API_BASE}/chat/reset_prompt`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "x-user-id": userId,
            }
          });
          const result = await response.json();
          if (response.ok && result.success) {
            appendMessage("bot", "사용자 정의 프롬프트가 기본값으로 초기화되었습니다.");
            appendSystemLog(`사용자 [${userId}] 프롬프트 초기화 완료: ${result.message}`);
          } else {
            appendMessage("bot", `프롬프트 초기화 실패: ${result.detail || "서버 오류"}`);
            appendSystemLog(`사용자 [${userId}] 프롬프트 초기화 실패: ${result.detail}`);
          }
        } catch (error) {
          console.error("프롬프트 초기화 오류:", error);
          appendMessage("bot", "프롬프트 초기화 중 오류가 발생했습니다.");
          appendSystemLog(`프롬프트 초기화 중 클라이언트 오류: ${error.message}`);
        }
      }

      // 이벤트 바인딩
      sendButton.addEventListener("click", sendMessage);
      input.addEventListener("keypress", function (e) {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });

      // 이벤트 바인딩
      resetDataButton.addEventListener("click", resetUserData);
      resetPromptButton.addEventListener("click", resetUserPrompt);
      sendButton.addEventListener("click", sendMessage);
      input.addEventListener("keypress", function (e) {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });
    });
  </script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const altInput = document.getElementById("chat-input-field-alt");
      const altSendButton = document.getElementById("sendButton-alt");
      const altChatBody = document.getElementById("chat-body-alt");
      const mainChatBody = document.getElementById("chat-body-main");

      // 프롬프트 추가 함수
      function appendAltMessage(message) {
        const msg = document.createElement("div");
        msg.classList.add("message", "bot");
        msg.textContent = message;
        altChatBody.appendChild(msg);
        altChatBody.scrollTop = altChatBody.scrollHeight;
      }

      // 버튼 클릭 이벤트
      altSendButton.addEventListener("click", async function () {
        const message = altInput.value.trim();
        if (!message) return;

        altInput.value = "";

        let userId = localStorage.getItem("userId");
        if (!userId) {
          userId = crypto.randomUUID();
          localStorage.setItem("userId", userId);
          console.log("새로운 userId 생성 (프롬프트 추가용):", userId);
        }

        try {
          const response = await fetch("/chat/add_prompt", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "x-user-id": userId
            },
            body: JSON.stringify({ prompt: message })
          });

          if (!response.ok) {
            const errorData = await response.json().catch(() => ({ detail: "서버 응답 오류" }));
            throw new Error(errorData.detail || "서버 응답 오류");
          }

          const result = await response.json();
          if (result.success && result.new_system_prompt) {
            appendAltMessage(`프롬프트가 성공적으로 적용되었습니다: ${result.new_system_prompt}`);
            // 메인 채팅창에도 알림 추가 (선택 사항)
            document.getElementById("chat-body-main").appendChild(
              Object.assign(document.createElement("div"), {
                className: "message bot",
                textContent: "프롬프트가 업데이트되었습니다!"
              })
            );
          } else {
            appendAltMessage("프롬프트 적용에 문제가 발생했습니다.");
          }
        } catch (error) {
          console.error("프롬프트 추가 오류:", error);
          appendAltMessage(`프롬프트 추가 중 오류가 발생했습니다: ${error.message}`);
        }
      });

      // Enter 키 이벤트
      altInput.addEventListener("keypress", function (e) {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          altSendButton.click();
        }
      });
    });
  </script>
