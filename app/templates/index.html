<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <title>스트리밍 챗봇</title>
  <style>
    /* 채팅 버튼 및 팝업창 관련 스타일 */
    #chat-popup {
      position: static;
      margin: 0;
      width: 430px;
      height: 705px;
      background-color: #fff;
      border-radius: 30px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
      opacity: 1;
      transition: opacity 0.3s ease, transform 0.3s ease;
      z-index: 999;
      pointer-events: auto;
    }

    #chat-popup.show {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    #chat-button {
      position: fixed;
      bottom: 20px;
      right: 50px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background-color: #007bff;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      cursor: pointer;
      transition: transform 0.3s ease;
      z-index: 1000;
    }

    #chat-button:hover {
      transform: scale(1.1);
    }

    #chat-button img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
    }

    #chat-header {
      background-color: transparent;
      padding: 20px;
      font-size: 16px;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }

    #chat-svg {
      margin-bottom: 0.5px;
    }

    #chat-header small {
      display: block;
      font-size: 12px;
      color: #666;
    }

    #chat-body {
      padding: 10px;
      height: calc(95% - 190px);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .message {
      padding: 10px;
      margin: 5px;
      border-radius: 10px;
      max-width: 80%;
    }

    .message.bot {
      background-color: #e9ecef;
      align-self: flex-start;
    }

    .message.user {
      background-color: #007bff;
      color: #fff;
      align-self: flex-end;
    }

    #chat-input {
      padding: 10px;
      border-top: 1px solid #ddd;
    }

    .input-wrapper {
      display: flex;
      align-items: center;
      background: #f1f1f1;
      border-radius: 30px;
      padding: 5px 10px;
    }

    .input-wrapper input {
      flex: 1;
      border: none;
      background: transparent;
      outline: none;
      font-size: 16px;
      padding: 10px;
    }

    .send-icon {
      cursor: pointer;
      background: none;
      border: none;
      font-size: 20px;
    }

    #pdf-upload {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #f9f9f9;
      border-top: 1px solid #ddd;
      padding: 10px 15px;
    }

    #pdf-upload input[type="file"] {
      flex: 1;
      font-size: 14px;
    }

    #uploadPdfBtn {
      padding: 8px 16px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
      transition: background-color 0.2s ease;
    }

    #uploadPdfBtn:hover {
      background-color: #0056b3;
    }

    #system-log-popup {
      position: static;
      margin: 0;
      width: 430px;
      height: 705px;
      background-color: #fff;
      border-radius: 30px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
      opacity: 1;
      transition: opacity 0.3s ease, transform 0.3s ease;
      z-index: 998;
      pointer-events: auto;
      left: unset;
    }

    #system-log-body {
      padding: 10px;
      height: 80%;
      max-height: 80%;
      overflow-y: auto;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      font-size: 15px;
      color: #333;
      scrollbar-width: thin;
      scrollbar-color: #bbb #f3f3f3;
    }

    #system-log-body::-webkit-scrollbar {
      width: 8px;
      background: #f3f3f3;
      border-radius: 8px;
    }

    #system-log-body::-webkit-scrollbar-thumb {
      background: #bbb;
      border-radius: 8px;
    }

    .system-log-message {
      padding: 10px;
      margin: 5px;
      border-radius: 10px;
      background-color: #f3f3f3;
      color: #222;
      font-family: monospace;
      max-width: 90%;
      word-break: break-all;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 60px;
      background: #f8f9fa;
    }

    #chat-popup-alt {
      position: static;
      margin: 0;
      width: 430px;
      height: 705px;
      background-color: #fff;
      border-radius: 30px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
      opacity: 1;
      transition: opacity 0.3s ease, transform 0.3s ease;
      z-index: 999;
      pointer-events: auto;
    }

    #chat-header-alt {
      background-color: transparent;
      padding: 20px;
      font-size: 16px;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }

    #chat-svg-alt {
      margin-bottom: 0.5px;
    }

    #chat-header-alt small {
      display: block;
      font-size: 12px;
      color: #666;
    }

    #chat-body-alt {
      padding: 10px;
      height: calc(95% - 190px);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .input-wrapper-alt {
      display: flex;
      align-items: center;
      background: #f1f1f1;
      border-radius: 30px;
      padding: 5px 10px;
    }

    .input-wrapper-alt input {
      flex: 1;
      border: none;
      background: transparent;
      outline: none;
      font-size: 16px;
      padding: 10px;
    }

    .send-icon-alt {
      cursor: pointer;
      background: none;
      border: none;
      font-size: 20px;
    }
  </style>
</head>

<body>
  <div id="chat-popup">
    <div id="chat-header">
      <div id="chat-svg">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="#007bff" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="10" />
        </svg>
      </div>
      <small>저희 챗봇과 대화하세요!</small>
    </div>
    <div id="chat-body">
      <div class="message bot">안녕하세요! 무엇을 도와드릴까요?</div>
    </div>
    <div id="pdf-upload" style="padding: 10px; border-top: 1px solid #ddd;">
      <input type="file" id="pdfInput" accept="application/pdf" style="display: none;" />
      <button id="uploadPdfBtn">PDF 업로드</button>
    </div>
    <div id="chat-input">
      <div class="input-wrapper">
        <input type="text" id="chat-input-field" placeholder="메시지를 입력해주세요.">
        <button class="send-icon" id="sendButton">→</button>
      </div>
    </div>
  </div>

  <div id="chat-popup-alt">
    <div id="chat-header-alt">
      <div id="chat-svg-alt">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="#007bff" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="10" />
        </svg>
      </div>
      <small>챗봇 프롬프트를 추가해보세요!</small>
    </div>
    <div id="chat-body-alt">
    </div>
    <div id="chat-input-alt">
      <div class="input-wrapper-alt">
        <input type="text" id="chat-input-field-alt" placeholder="메시지를 입력해주세요.">
        <button class="send-icon-alt" id="sendButton-alt">→</button>
      </div>
    </div>
  </div>

  <div id="system-log-popup">
    <div id="chat-header">
      <div id="chat-svg">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="#28a745" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="10" />
        </svg>
      </div>
      <small>시스템 로그</small>
    </div>
    <div id="system-log-body">
      <!-- 시스템 로그 메시지가 여기에 출력됩니다 -->
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const API_BASE = window.location.origin;
      const input = document.getElementById("chat-input-field");
      const chatBox = document.getElementById("chat-body");
      const sendButton = document.getElementById("sendButton");
      const uploadButton = document.getElementById("uploadPdfBtn");
      const fileInput = document.getElementById("pdfInput");
      let lastBotDiv = null;
      let partial = "";

      // 메시지 추가 함수
      function appendMessage(role, message) {
        const msg = document.createElement("div");
        msg.classList.add("message", role);
        msg.textContent = message;
        chatBox.appendChild(msg);
        chatBox.scrollTop = chatBox.scrollHeight;
        return msg;
      }

      // 시스템 로그 출력 함수
      function appendSystemLog(message) {
        console.log("appendSystemLog 호출:", message);
        const logBody = document.getElementById("system-log-body");
        if (!logBody) {
          console.error("system-log-body를 찾을 수 없습니다.");
          return;
        }
        const msg = document.createElement("div");
        msg.classList.add("system-log-message");
        msg.textContent = message;
        logBody.appendChild(msg);
        logBody.scrollTop = logBody.scrollHeight;
      }

      // 챗봇 메시지 전송 함수
      async function sendMessage() {
        const message = input.value.trim();
        if (!message) return;

        appendMessage("user", message);
        input.value = "";
        sendButton.style.display = "none";
        partial = "";
        lastBotDiv = null;

        try {
          const response = await fetch(`${API_BASE}/chat/stream`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: message })
          });
          const reader = response.body.getReader();
          const decoder = new TextDecoder();

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            const text = decoder.decode(value, { stream: true });
            const lines = text.split("\n");
            for (let line of lines) {
              if (line.startsWith("data: ")) {
                let content = line.slice(6);
                content = content.replace(/\n/g, "<br>");
                partial += content;
                if (!lastBotDiv) {
                  lastBotDiv = document.createElement("div");
                  lastBotDiv.classList.add("message", "bot");
                  chatBox.appendChild(lastBotDiv);
                }
                lastBotDiv.innerHTML = partial;
                chatBox.scrollTop = chatBox.scrollHeight;
              }
            }
          }
        } catch (err) {
          console.error("전송 오류:", err);
          appendMessage("bot", "오류가 발생했습니다. 다시 시도해주세요.");
          appendSystemLog(`메시지 전송 오류: ${err.message}`);
        } finally {
          sendButton.style.display = "";
        }
      }

      // PDF 업로드 함수 (폴링 추가)
      async function uploadPdf() {
        const file = fileInput.files[0];
        if (!file) {
          appendMessage("bot", "PDF 파일을 선택해주세요.");
          appendSystemLog("PDF 파일이 선택되지 않았습니다.");
          return;
        }

        const formData = new FormData();
        formData.append("file", file);

        try {
          const response = await fetch(`${API_BASE}/upload_pdf`, {
            method: "POST",
            body: formData
          });

          if (!response.ok) {
            const text = await response.text();
            console.error(`서버 응답 오류: ${response.status} ${response.statusText}`, text.slice(0, 200));
            appendMessage("bot", `PDF 업로드 실패: 서버 오류 (${response.status})`);
            appendSystemLog(`서버 오류: ${response.status} ${response.statusText}`);
            return;
          }

          const contentType = response.headers.get("content-type");
          if (!contentType || !contentType.includes("application/json")) {
            const text = await response.text();
            console.error("비-JSON 응답:", text);
            appendMessage("bot", "PDF 업로드 실패: 서버에서 잘못된 응답 형식을 반환했습니다.");
            appendSystemLog("서버에서 JSON이 아닌 응답을 반환했습니다.");
            return;
          }

          const result = await response.json();
          console.log("서버 응답:", result);

          if (result.success) {
            appendMessage("bot", result.message || "PDF 처리가 시작되었습니다.");
            if (result.logs && Array.isArray(result.logs)) {
              console.log("로그 출력:", result.logs);
              result.logs.forEach(msg => appendSystemLog(msg));
            }
            // 폴링 시작
            if (result.task_id) {
              pollTaskStatus(result.task_id);
            }
          } else {
            appendMessage("bot", `PDF 업로드 실패: ${result.detail || "서버 오류"}`);
            if (result.logs && Array.isArray(result.logs)) {
              result.logs.forEach(msg => appendSystemLog(msg));
            } else {
              appendSystemLog(`업로드 실패: ${result.detail || "서버 오류"}`);
            }
          }
        } catch (error) {
          console.error("업로드 오류:", error);
          appendMessage("bot", "PDF 업로드 중 오류가 발생했습니다.");
          appendSystemLog(`PDF 업로드 중 오류: ${error.message}`);
        }
      }

      // 작업 상태 폴링 함수
      async function pollTaskStatus(task_id) {
        const interval = setInterval(async () => {
          try {
            const interval = setInterval(async () => {
              try {
                const response = await fetch(`${API_BASE}/task_status/${task_id}`);
                if (!response.ok) {
                  const errorMsg = `서버 응답 오류: ${response.status}`;
                  console.error(errorMsg);
                  appendSystemLog(errorMsg);
                  clearInterval(interval);
                  return;
                }

                const result = await response.json();

                // 로그가 존재하면 갱신
                if (Array.isArray(result.logs)) {
                  const logContainer = document.getElementById("log-output");
                  logContainer.innerHTML = result.logs.map(log => `<div>${log}</div>`).join("");
                }

                // 작업 완료 상태일 경우 polling 종료
                if (["completed", "failed"].includes(result.status)) {
                  appendSystemLog(`작업 상태: ${result.status === "completed" ? "✅ 완료됨" : "❌ 실패함"}`);
                  clearInterval(interval);
                }
              } catch (error) {
                console.error("작업 상태 확인 중 예외 발생:", error);
                appendSystemLog(`작업 상태 확인 중 예외 발생: ${error.message}`);
                clearInterval(interval);
              }
            }, 2000); // 2초마다 polling
            const result = await response.json();
            if (result.status === "completed") {
              appendMessage("bot", `PDF 처리 완료: ${result.page_count || 0} 페이지`);
              if (result.logs && Array.isArray(result.logs)) {
                result.logs.forEach(msg => appendSystemLog(msg));
              }
              clearInterval(interval);
            } else if (result.status === "failed") {
              appendMessage("bot", `PDF 처리 실패: ${result.detail || "서버 오류"}`);
              if (result.logs && Array.isArray(result.logs)) {
                result.logs.forEach(msg => appendSystemLog(msg));
              }
              clearInterval(interval);
            }
          } catch (error) {
            console.error("폴링 오류:", error);
            appendSystemLog(`작업 상태 확인 오류: ${error.message}`);
            clearInterval(interval);
          }
        }, 5000); // 5초마다 폴링
      }

      // PDF 업로드 버튼 클릭 시 파일 선택창 열기
      uploadButton.addEventListener("click", function () {
        fileInput.value = "";
        fileInput.click();
      });

      // 파일 선택 시 자동 업로드
      fileInput.addEventListener("change", function () {
        if (fileInput.files.length > 0) {
          uploadPdf();
        }
      });

      // 이벤트 바인딩
      sendButton.addEventListener("click", sendMessage);
      input.addEventListener("keypress", function (e) {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });
    });
  </script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const altInput = document.getElementById("chat-input-field-alt");
      const altSendButton = document.getElementById("sendButton-alt");
      const altChatBody = document.getElementById("chat-body-alt");
      const mainChatBody = document.getElementById("chat-body");

      // 프롬프트 추가 함수
      function appendAltMessage(message) {
        const msg = document.createElement("div");
        msg.classList.add("message", "bot");
        msg.textContent = message;
        altChatBody.appendChild(msg);
        altChatBody.scrollTop = altChatBody.scrollHeight;
      }

      // 버튼 클릭 이벤트
      altSendButton.addEventListener("click", async function () {
        const message = altInput.value.trim();
        if (!message) return;

        // 입력 필드 초기화
        altInput.value = "";

        try {
          const response = await fetch("/chat/add_prompt", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ prompt: message })
          });

          if (!response.ok) {
            throw new Error("서버 응답 오류");
          }

          const result = await response.json();
          const chatHistory = result.chatHistory;

          // 프롬프트 추가
          appendAltMessage(`프롬프트가 추가되었습니다: ${message}\n이전 내역:\n${chatHistory}`);
        } catch (error) {
          console.error("프롬프트 추가 오류:", error);
          appendAltMessage("프롬프트 추가 중 오류가 발생했습니다.");
        }
      });

      // Enter 키 이벤트
      altInput.addEventListener("keypress", function (e) {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          altSendButton.click();
        }
      });
    });
  </script>
</body>

</html>
