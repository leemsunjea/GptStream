<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <title>스트리밍 챗봇</title>
  <!-- <link rel="stylesheet" href="/static/style.css"> -->

  <style>
    /* 채팅 버튼 및 팝업창 관련 스타일 */
    #chat-popup {
      position: static;
      /* fixed 해제 */
      margin: 0;
      width: 430px;
      height: 705px;
      background-color: #fff;
      border-radius: 30px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
      opacity: 1;
      transition: opacity 0.3s ease, transform 0.3s ease;
      z-index: 999;
      pointer-events: auto;
    }

    #chat-popup.show {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
      /* 챗봇이 활성화되었을 때만 클릭 가능 */
    }

    /* 챗봇 버튼 스타일 */
    #chat-button {
      position: fixed;
      bottom: 20px;
      right: 50px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background-color: #007bff;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      cursor: pointer;
      transition: transform 0.3s ease;
      z-index: 1000;
    }

    #chat-button:hover {
      transform: scale(1.1);
    }

    #chat-button img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
    }

    /* 헤더 영역 */
    #chat-header {
      background-color: transparent;
      padding: 20px;
      font-size: 16px;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }

    #chat-svg {
      margin-bottom: 0.5px;
    }

    #chat-header small {
      display: block;
      font-size: 12px;
      color: #666;
    }

    /* 대화 영역 */
    #chat-body {
      padding: 10px;
      height: calc(95% - 190px);
      /* 기존 140px → 190px로 수정 */
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    /* 메시지 스타일 */
    .message {
      padding: 10px;
      margin: 5px;
      border-radius: 10px;
      max-width: 80%;
    }

    .message.bot {
      background-color: #e9ecef;
      align-self: flex-start;
    }

    .message.user {
      background-color: #007bff;
      color: #fff;
      align-self: flex-end;
    }

    /* 입력창 영역 */
    #chat-input {
      padding: 10px;
      border-top: 1px solid #ddd;
    }

    .input-wrapper {
      display: flex;
      align-items: center;
      background: #f1f1f1;
      border-radius: 30px;
      padding: 5px 10px;
    }

    .input-wrapper input {
      flex: 1;
      border: none;
      background: transparent;
      outline: none;
      font-size: 16px;
      padding: 10px;
    }

    /* 보내기 버튼 스타일 */
    .send-icon {
      cursor: pointer;
      background: none;
      border: none;
      font-size: 20px;
    }

    #pdf-upload {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #f9f9f9;
      border-top: 1px solid #ddd;
      padding: 10px 15px;
    }

    #pdf-upload input[type="file"] {
      flex: 1;
      font-size: 14px;
    }

    #uploadPdfBtn {
      padding: 8px 16px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
      transition: background-color 0.2s ease;
    }

    #uploadPdfBtn:hover {
      background-color: #0056b3;
    }

    /* 시스템 로그 팝업창: 오른쪽에 위치 */
    #system-log-popup {
      position: static;
      /* fixed 해제 */
      margin: 0;
      width: 430px;
      height: 705px;
      background-color: #fff;
      border-radius: 30px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
      opacity: 1;
      transition: opacity 0.3s ease, transform 0.3s ease;
      z-index: 998;
      pointer-events: auto;
      left: unset;
    }

    #system-log-body {
      padding: 10px;
      height: calc(100% - 80px);
      overflow-y: auto;
      /* 세로 스크롤 자동 */
      overflow-x: hidden;
      /* 가로 스크롤 숨김 */
      display: flex;
      flex-direction: column;
      font-size: 15px;
      color: #333;
      /* 스크롤바 항상 오른쪽에 표시 */
      scrollbar-width: thin;
      /* Firefox */
      scrollbar-color: #bbb #f3f3f3;
    }

    /* 크롬, 엣지, 사파리용 스크롤바 스타일 */
    #system-log-body::-webkit-scrollbar {
      width: 8px;
      background: #f3f3f3;
      border-radius: 8px;
    }

    #system-log-body::-webkit-scrollbar-thumb {
      background: #bbb;
      border-radius: 8px;
    }

    /* 시스템 로그 메시지 스타일 */
    .system-log-message {
      padding: 10px;
      margin: 5px;
      border-radius: 10px;
      background-color: #f3f3f3;
      color: #222;
      font-family: monospace;
      max-width: 90%;
      word-break: break-all;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 60px;
      /* 두 창 사이 간격 */
      background: #f8f9fa;
    }
  </style>
</head>

<body>
  <!-- 채팅 버튼 -->
  <!-- <div id="chat-button">
    <img src="https://encrypted-tbn3.gstatic.com/images?q=tbn:ANd9GcQNXaujUJBXZrKXOPikVUxrdGgab_04TmHuuKiEyZRhkWLvpStV"
      alt="Chat Button">
  </div> -->

  <!-- 채팅 팝업창 -->
  <div id="chat-popup">
    <div id="chat-header">
      <div id="chat-svg">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="#007bff" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="10" />
        </svg>
      </div>
      <small>저희 챗봇과 대화하세요!</small>
    </div>
    <div id="chat-body">
      <div class="message bot">안녕하세요! 무엇을 도와드릴까요?</div>
    </div>
    <!-- PDF 업로드 영역 -->
    <div id="pdf-upload" style="padding: 10px; border-top: 1px solid #ddd;">
      <input type="file" id="pdfInput" accept="application/pdf" style="display: none;" />
      <button id="uploadPdfBtn">PDF 업로드</button>
    </div>
    <div id="chat-input">
      <div class="input-wrapper">
        <input type="text" id="chat-input-field" placeholder="메시지를 입력해주세요.">
        <button class="send-icon" id="sendButton">→</button>
      </div>
    </div>
  </div>

  <!-- 시스템 로그 팝업창 (채팅창과 동일한 UI, 오른쪽에 위치) -->
  <div id="system-log-popup">
    <div id="chat-header">
      <div id="chat-svg">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="#28a745" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="10" />
        </svg>
      </div>
      <small>시스템 로그</small>
    </div>
    <div id="system-log-body">
      <!-- 시스템 로그 메시지가 여기에 출력됩니다 -->
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const API_BASE = window.location.origin;
      const input = document.getElementById("chat-input-field");
      const chatBox = document.getElementById("chat-body");
      const sendButton = document.getElementById("sendButton");
      const uploadButton = document.getElementById("uploadPdfBtn");
      const fileInput = document.getElementById("pdfInput");
      let lastBotDiv = null;
      let partial = "";

      // 메시지 추가 함수
      function appendMessage(role, message) {
        const msg = document.createElement("div");
        msg.classList.add("message", role);
        msg.textContent = message;
        chatBox.appendChild(msg);
        chatBox.scrollTop = chatBox.scrollHeight;
      }

      // 시스템 로그 출력 함수-------------------------------------
      function appendSystemLog(message) {
        const logBody = document.getElementById("system-log-body");
        const msg = document.createElement("div");
        msg.classList.add("system-log-message");
        msg.textContent = message;
        logBody.appendChild(msg);
        logBody.scrollTop = logBody.scrollHeight;
      }

      // 챗봇 메시지 전송 함수
      async function sendMessage() {
        const message = input.value.trim();
        if (!message) return;

        appendMessage("user", message);
        input.value = "";
        sendButton.style.display = "none";
        partial = "";
        lastBotDiv = null;

        try {
          const response = await fetch(`${API_BASE}/chat/stream`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: message })
          });
          const reader = response.body.getReader();
          const decoder = new TextDecoder();

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            const text = decoder.decode(value, { stream: true });
            const lines = text.split("\n");
            for (let line of lines) {
              if (line.startsWith("data: ")) {
                let content = line.slice(6);
                // '~~'를 <br>로 변환
                content = content.replace(/~~/g, "<br>");
                partial += content;
                if (!lastBotDiv) {
                  lastBotDiv = document.createElement("div");
                  lastBotDiv.classList.add("message", "bot");
                  chatBox.appendChild(lastBotDiv);
                }
                lastBotDiv.innerHTML = partial; // textContent → innerHTML로 변경!
                chatBox.scrollTop = chatBox.scrollHeight;
              }
            }
          }
        } catch (err) {
          console.error("전송 오류:", err);
          appendMessage("bot", "오류가 발생했습니다. 다시 시도해주세요.");
        } finally {
          sendButton.style.display = "";
        }
      }
      let processingInterval = null; // 전역에서 관리 필요

      // PDF 업로드 함수
      async function uploadPdf() {
        const file = fileInput.files[0];
        if (!file) {
          alert("PDF 파일을 선택해주세요.");
          return;
        }

        const formData = new FormData();
        formData.append("file", file);

        try {
          const response = await fetch(`${API_BASE}/upload_pdf`, {
            method: "POST",
            body: formData
          });

          const contentType = response.headers.get("content-type") || "";

          if (contentType.includes("text/event-stream")) {
            const reader = response.body.getReader();
            const decoder = new TextDecoder();

            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              const text = decoder.decode(value, { stream: true });
              const lines = text.split("\n");

              for (let line of lines) {
                line = line.trim();
                if (!line.startsWith("data:")) continue;

                const logMsg = line.slice(5).trim(); // "data:" 이후 내용
                if (logMsg && logMsg !== "[DONE]") {
                  appendSystemLog(logMsg); // 로그 메시지 출력
                }
              }
            }
          } else if (contentType.includes("application/json")) {
            let result;
            try {
              result = await response.json();
            } catch (e) {
              const errorText = await response.text();
              appendMessage("bot", "서버 응답 파싱에 실패했습니다.");
              appendSystemLog(`서버 응답 파싱 실패: ${errorText}`);
              return;
            }

            processing = false;
            clearInterval(processingInterval);

            if (response.ok) {
              appendMessage("bot", `PDF가 성공적으로 업로드되어 인덱싱되었습니다. (저장된 페이지 수: ${result.page_count}, 벡터 수: ${result.vector_count})`);
              if (result.logs && Array.isArray(result.logs)) {
                result.logs.forEach(msg => appendSystemLog(msg));
              }
            } else {
              appendMessage("bot", `업로드 실패: ${result.detail || "서버 오류"}`);
              if (result.logs && Array.isArray(result.logs)) {
                result.logs.forEach(msg => appendSystemLog(msg));
              } else {
                appendSystemLog(`업로드 실패: ${result.detail || "서버 오류"}`);
              }
            }
          } else {
            appendMessage("bot", "알 수 없는 응답 형식입니다.");
            appendSystemLog("지원하지 않는 서버 응답 형식입니다.");
          }

        } catch (error) {
          processing = false;
          clearInterval(processingInterval);
          console.error("업로드 오류:", error);
          appendMessage("bot", "PDF 업로드 중 오류가 발생했습니다.");
          appendSystemLog("PDF 업로드 중 오류가 발생했습니다.");
        }
      }

      // PDF 업로드 버튼 클릭 시 파일 선택창 열기
      uploadButton.addEventListener("click", function () {
        fileInput.value = ""; // 같은 파일 연속 선택 시에도 이벤트 발생하도록 초기화
        fileInput.click();
      });

      // 파일 선택 시 자동 업로드
      fileInput.addEventListener("change", function () {
        if (fileInput.files.length > 0) {
          uploadPdf();
        }
      });

      // 이벤트 바인딩
      sendButton.addEventListener("click", sendMessage);
      input.addEventListener("keypress", function (e) {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });
    });
  </script>
</body>

</html>
```
